server:
  servlet:
    context-path: /api/v1
spring:
  application:
    name: backend
  task:
    execution:
      mode: force
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${TEST_DB_URL:${DB_URL}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mongodb:
    uri: ${TEST_MONGODB_URI:mongodb://localhost:27017/gachi_gacha_test}
  data:
    mongodb:
      auto-index-creation: true
  jpa:
    # 운영과 같이 OSIV를 끈 상태로 테스트한다. 컨트롤러·응답 변환 단계의 지연 로딩이 있으면 테스트가 실패한다.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
cloud:
  aws:
    region: test
    s3:
      bucket: test-bucket
      folder: test


instagram:
  api:
    uri: "https://dummy-uri.com"
    user-id: "dummy-user-id"
    access-token: "dummy-access-token"

jwt:
  secret-key: "test-secret-key-for-testing-purposes-only-1234567890"
  access-token-expiration-minutes: 30
  refresh-token-expiration-day: 14
  
cors:
  allowed-origin-patterns:
    - http://localhost:*

elasticsearch:
  url: localhost:8080
  api-key: elastic-key
  index:
    gacha: index
    trade: index
  init:
    enabled: false

firebase:
  push-enabled: false
oauth:
  frontend-callback-url: fron_callback_url
  frontend-withdraw-callback-url: front_withdraw_callback_url
