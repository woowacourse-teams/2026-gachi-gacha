server:
  servlet:
    context-path: /api/v1
spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
cloud:
  aws:
    region: test
    s3:
      bucket: test-bucket
      folder: test
