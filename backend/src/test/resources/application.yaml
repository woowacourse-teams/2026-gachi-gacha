server:
  servlet:
    context-path: /api/v1
spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${TEST_DB_URL:${DB_URL}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
cloud:
  aws:
    region: test
    s3:
      bucket: test-bucket
      folder: test


instagram:
  api:
    uri: "https://dummy-uri.com"
    user-id: "dummy-user-id"
    access-token: "dummy-access-token"
