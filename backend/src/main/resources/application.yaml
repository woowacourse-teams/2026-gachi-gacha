server:
  servlet:
    context-path: /api/v1
spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
      folder: ${AWS_S3_FOLDER}

instagram:
  api:
    uri: "https://graph.facebook.com/v26.0"
    user-id: ${META_IG_USER_ID}
    access-token: ${META_ACCESS_TOKEN}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    distribution:
      percentiles-histogram:
        s3.client.requests: true # 커스텀 S3 메트릭 P95/P99 활성화
        http.server.requests: true # HTTP API 요청 P95/P99 활성화 (권장)

oauth:
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URL}
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    scope:
      - openid
      - profile_nickname
      - profile_image
  naver:
    redirect-uri: ${NAVER_REDIRECT_URL}
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    scope:
      - openid
jwt:
  access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES}
  refresh-token-expirationDay: ${JWT_REFRESH_EXPIRATION_DAY}
  refresh-cleanup:
    cron: ${REFRESH_CLEAN_TIME:0 0 4 * * *}
  secret-key: ${JWT_SECRET_KEY}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}

# ============================================================================
# API 문서 (springdoc-openapi)
#
# 기본값이 false 다. 운영에 SWAGGER_ENABLED 를 넣지 않으면 자동으로 닫힌다.
# "실수로 열리는" 방향이 아니라 "의도적으로 열어야 열리는" 방향으로 둔 것이다.
#
# api-docs 와 swagger-ui 를 같은 변수로 묶었다. UI 만 끄고 api-docs 를 열어두면
# 스펙 JSON(전체 엔드포인트·파라미터·DTO 구조)이 그대로 노출되기 때문이다.
#
# 로컬: .env 의 SWAGGER_ENABLED=true
# 확인: 운영에서 GET /api/v1/v3/api-docs 가 스펙을 내려주지 않아야 한다.
#       (현재는 매핑되지 않은 경로가 전부 500 CE003 으로 떨어진다. 404 가 아닌 것은
#        GlobalExceptionHandler 가 Exception 을 모두 받기 때문이며, 이 설정과 무관한 기존 동작이다.)
# ============================================================================
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  # MCP 노출 기능. 3.1.1 에서 보안 권고 6건이 나오면서 opt-in 으로 바뀌었다.
  # 기본값도 false 지만, 향후 기본값이 뒤집혀도 닫혀 있도록 명시해 둔다.
  ai:
    mcp:
      enabled: false
