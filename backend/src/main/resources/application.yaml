server:
  servlet:
    context-path: /api/v1
    session:
      cookie:
        same-site: none
        secure: true
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 200
    max-connections: 8192
    accept-count: 100
spring:
  application:
    name: backend
  task:
    execution:
      # 알림 전용 실행기(notificationExecutor)를 Bean 으로 등록해도 기본 applicationTaskExecutor 가
      # 물러나지 않게 한다. 기존 @Async 작업과 WebSocket 은 계속 기본 실행기를 쓴다.
      mode: force
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000 # ms
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
      folder: ${AWS_S3_FOLDER}

instagram:
  api:
    uri: "https://graph.facebook.com/v26.0"
    user-id: ${META_IG_USER_ID}
    access-token: ${META_ACCESS_TOKEN}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    distribution:
      percentiles-histogram:
        s3.client.requests: true # 커스텀 S3 메트릭 P95/P99 활성화
        http.server.requests: true # HTTP API 요청 P95/P99 활성화 (권장)

oauth:
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URL}
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    scope:
      - openid
      - profile_nickname
      - profile_image
  naver:
    redirect-uri: ${NAVER_REDIRECT_URL}
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    scope:
      - openid
  apple:
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY}
    redirect-uri: ${APPLE_REDIRECT_URI}
    withdraw-redirect-uri: ${APPLE_WITHDRAW_REDIRECT_URI}
    scope:
      - name
      - email
jwt:
  access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES}
  refresh-token-expirationDay: ${JWT_REFRESH_EXPIRATION_DAY}
  refresh-cleanup:
    cron: ${REFRESH_CLEAN_TIME:0 0 4 * * *}
  secret-key: ${JWT_SECRET_KEY}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  ai:
    mcp:
      enabled: false

firebase:
  # 꺼져 있으면 푸시를 FCM 으로 보내지 않고 로그만 남긴다. 서버에서는 반드시 true 로 둔다.
  push-enabled: ${FCM_PUSH_ENABLED:false}
  # Firebase 콘솔 > 프로젝트 설정 > 서비스 계정에서 받은 비공개 키(JSON) 파일 내용을 Base64 로 인코딩한 값.
  # dev 서버에는 gachi-gacha-dev, prod 서버에는 gachi-gacha-prod 프로젝트의 키를 넣는다.
  service-account-key-base64: ${FIREBASE_SERVICE_ACCOUNT_KEY_BASE64:}

elasticsearch:
  url: ${ELASTIC_SEARCH_URL}
  api-key: ${ELASTIC_SEARCH_API_KEY}
  index:
    gacha: ${ELASTIC_GACHA_INDEX}
    trade: ${ELASTIC_TRADE_INDEX}

