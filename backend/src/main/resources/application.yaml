server:
  servlet:
    context-path: /api/v1
spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
      folder: ${AWS_S3_FOLDER}

instagram:
  api:
    uri: "https://graph.facebook.com/v26.0"
    user-id: ${META_IG_USER_ID}
    access-token: ${META_ACCESS_TOKEN}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name} # 'backend' 값이 자동으로 매핑됩니다.
    distribution:
      percentiles-histogram:
        s3.client.requests: true # 커스텀 S3 메트릭 P95/P99 활성화
        http.server.requests: true # HTTP API 요청 P95/P99 활성화 (권장)
