server:
  servlet:
    context-path: /api/v1
spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
      folder: ${AWS_S3_FOLDER}

instagram:
  api:
    uri: "https://graph.facebook.com/v26.0"
    user-id: ${META_IG_USER_ID}
    access-token: ${META_ACCESS_TOKEN}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    distribution:
      percentiles-histogram:
        s3.client.requests: true # 커스텀 S3 메트릭 P95/P99 활성화
        http.server.requests: true # HTTP API 요청 P95/P99 활성화 (권장)

oauth:
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URL}
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    scope:
      - openid
      - profile_nickname
      - profile_image
  naver:
    redirect-uri: ${NAVER_REDIRECT_URL}
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    scope:
      - openid
jwt:
  access-token-expiration-day: ${JWT_EXPIRATION_DAY}
  secret-key: ${JWT_SECRET_KEY}
