server:
  servlet:
    context-path: /api/v1
  forward-headers-strategy: framework
spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
      folder: ${AWS_S3_FOLDER}

instagram:
  api:
    uri: "https://graph.facebook.com/v26.0"
    user-id: ${META_IG_USER_ID}
    access-token: ${META_ACCESS_TOKEN}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    distribution:
      percentiles-histogram:
        s3.client.requests: true # 커스텀 S3 메트릭 P95/P99 활성화
        http.server.requests: true # HTTP API 요청 P95/P99 활성화 (권장)

oauth:
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URL}
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    scope:
      - openid
      - profile_nickname
      - profile_image
  naver:
    redirect-uri: ${NAVER_REDIRECT_URL}
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    scope:
      - openid
jwt:
  access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES}
  refresh-token-expirationDay: ${JWT_REFRESH_EXPIRATION_DAY}
  refresh-cleanup:
    cron: ${REFRESH_CLEAN_TIME:0 0 4 * * *}
  secret-key: ${JWT_SECRET_KEY}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  ai:
    mcp:
      enabled: false
