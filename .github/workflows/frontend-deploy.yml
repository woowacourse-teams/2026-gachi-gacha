name: Frontend Deploy

on:
  push:
    branches:
      - frontend-dev

permissions:
  contents: read

jobs:
  build-and-deploy-dev:
    name: Build & Deploy to DEV
    
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - frontend-dev

    environment:
      name: frontend-development
      url: ${{ vars.DEV_FRONTEND_URL }}

    defaults:
      run:
        working-directory: frontend

    env:
      DEPLOY_ROOT: /srv/gachi-gacha/frontend-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Runner 내장 npm 대신 프로젝트 Node의 정상 npm으로 pnpm을 설치한다.
      - name: Set up Node.js before pnpm installer
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      # pnpm 설치 후에만 pnpm store 경로를 조회하여 캐시할 수 있다.
      - name: Restore pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build development artifact
        env:
          KAKAO_MAP_KEY: ${{ vars.DEV_KAKAO_MAP_KEY }}
        # /demo만 홍보용 화면을 제공하고 그 외 주소는 기존 앱을 유지한다.
        # 일반 pnpm build와 PROD 배포에는 데모가 포함되지 않는다.
        run: pnpm build --env demo

      - name: Deploy to Nginx Directory
        shell: bash
        run: |
          release_dir="${DEPLOY_ROOT}/releases/${GITHUB_SHA}"
          mkdir -p "${release_dir}"
          cp -a dist/. "${release_dir}/"
          
          ln -sfn "${release_dir}" "${DEPLOY_ROOT}/current.next"
          mv -Tf "${DEPLOY_ROOT}/current.next" "${DEPLOY_ROOT}/current"
