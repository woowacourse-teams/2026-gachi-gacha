name: Frontend Deploy

on:
  push:
    branches:
      - frontend-dev
    paths:
      - "frontend/**"
      - "!frontend/**/AGENTS.md"

permissions:
  contents: read

jobs:
  build-and-deploy-dev:
    name: Build & Deploy to DEV

    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - frontend-dev

    environment:
      name: frontend-development
      url: ${{ vars.DEV_FRONTEND_URL }}

    defaults:
      run:
        working-directory: frontend

    env:
      DEPLOY_ROOT: /srv/gachi-gacha/frontend-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Runner 내장 npm 대신 프로젝트 Node의 정상 npm으로 pnpm을 설치한다.
      - name: Set up Node.js before pnpm installer
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Install pnpm
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # bootstrap/self-update 없이 고정 버전을 작업별 임시 경로에 설치한다.
          gachi_pnpm_dir="$(mktemp -d "${RUNNER_TEMP:?}/gachi-pnpm.XXXXXX")"
          timeout --kill-after=10s 120s npm install \
            --prefix "$gachi_pnpm_dir" \
            --no-save --package-lock=false --ignore-scripts --no-audit --no-fund \
            pnpm@11.9.0

          gachi_pnpm_bin="$gachi_pnpm_dir/node_modules/.bin"
          test "$(timeout --kill-after=5s 15s "$gachi_pnpm_bin/pnpm" --version)" = "11.9.0"
          printf '%s\n' "$gachi_pnpm_bin" >> "$GITHUB_PATH"

      # pnpm 설치 후에만 pnpm store 경로를 조회하여 캐시할 수 있다.
      - name: Restore pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build development artifact
        env:
          APP_ENV: development
          KAKAO_MAP_KEY: ${{ vars.DEV_KAKAO_MAP_KEY }}
          # 개발 사용 기록이 운영 PostHog 프로젝트에 유입되지 않도록 고정한다.
          POSTHOG_ENABLED: "false"
          SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
          AFFILIATE_CATALOG_ENABLED: ${{ vars.AFFILIATE_CATALOG_ENABLED || 'true' }}
          EVENT_APPLICATION_ENABLED: ${{ vars.EVENT_APPLICATION_ENABLED }}
          EVENT_APPLICATION_ENDPOINT: ${{ vars.EVENT_APPLICATION_ENDPOINT }}
          EVENT_APPLICATION_START_AT: ${{ vars.EVENT_APPLICATION_START_AT }}
          EVENT_APPLICATION_END_AT: ${{ vars.EVENT_APPLICATION_END_AT }}
          EVENT_APPLICATION_CAMPAIGN_ID: ${{ vars.EVENT_APPLICATION_CAMPAIGN_ID }}
          MEMBER_REPORT_ENDPOINT: ${{ vars.MEMBER_REPORT_ENDPOINT }}
        run: pnpm build

      - name: Remove source maps from deployment artifact
        run: find dist -type f -name '*.map' -delete

      - name: Deploy to Nginx Directory
        shell: bash
        run: |
          release_dir="${DEPLOY_ROOT}/releases/${GITHUB_SHA}"
          mkdir -p "${release_dir}"
          cp -a dist/. "${release_dir}/"

          ln -sfn "${release_dir}" "${DEPLOY_ROOT}/current.next"
          mv -Tf "${DEPLOY_ROOT}/current.next" "${DEPLOY_ROOT}/current"
