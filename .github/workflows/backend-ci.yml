name: Backend CI

on:
  pull_request:
    branches:
      - backend-dev
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

  push:
    branches:
      - backend-dev
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 1️⃣ Checkout repository
        uses: actions/checkout@v7

      - name: 2️⃣ Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: 3️⃣ Build and test
        run: ./gradlew build
        env:
          DB_URL: jdbc:postgresql://localhost:5432/${{ secrets.CI_POSTGRES_DB }}
          DB_USERNAME: ${{ secrets.CI_POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
