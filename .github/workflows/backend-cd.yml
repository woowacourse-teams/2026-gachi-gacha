name: Backend CD Pipeline

on:
  push:
    branches:
      - backend-dev
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create .env file
        run: |
          cd backend
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Build BootJar
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon -Dorg.gradle.jvmargs="-Xmx512m"

      - name: Deploy Application
        run: |
          cd backend
          APP_PORT=8080
          CURRENT_PID=$(lsof -t -i:${APP_PORT} || true)

          if [ -n "$CURRENT_PID" ]; then
            echo "==> 포트 ${APP_PORT}의 기존 프로세스 종료 (PID: $CURRENT_PID)..."
            kill -15 $CURRENT_PID || kill -9 $CURRENT_PID
            sleep 5
          fi

          JAR_PATH=$(ls build/libs/*.jar 2>/dev/null | grep -v 'plain' | head -n 1)
          
          if [ -z "$JAR_PATH" ]; then
            echo "==> [ERROR] JAR 파일을 찾을 수 없습니다. 빌드가 정상 완료되었는지 확인하세요."
            exit 1
          fi

          echo "==> 실행할 JAR 파일: $JAR_PATH"

          if [ -s .env ]; then
            export $(grep -v '^#' .env | xargs 2>/dev/null)
          fi

          # RUNNER_TRACKING_ID="" + setsid + nohup 조합으로 러너 세션 종료 후에도 프로세스 상주
          LOG_PATH="$(pwd)/app.log"
          RUNNER_TRACKING_ID="" setsid nohup java -jar $JAR_PATH > "$LOG_PATH" 2>&1 &
          
          echo "==> Spring Boot 배포 프로세스 완료!"
