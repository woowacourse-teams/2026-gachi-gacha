name: Frontend PROD Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy-prod:
    name: Build & Deploy to PROD
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - frontend-prod

    environment:
      name: frontend-production
      url: ${{ vars.PROD_FRONTEND_URL }}

    defaults:
      run:
        working-directory: frontend

    env:
      DEPLOY_ROOT: /srv/gachi-gacha/frontend-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Runner 내장 npm 대신 프로젝트 Node의 정상 npm으로 pnpm을 설치한다.
      - name: Set up Node.js before pnpm installer
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      # pnpm 설치 후에만 pnpm store 경로를 조회하여 캐시할 수 있다.
      - name: Restore pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifact
        env:
          APP_ENV: production
          KAKAO_MAP_KEY: ${{ vars.PROD_KAKAO_MAP_KEY }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
          POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED }}
          EVENT_APPLICATION_ENABLED: ${{ vars.EVENT_APPLICATION_ENABLED }}
          EVENT_APPLICATION_ENDPOINT: ${{ vars.EVENT_APPLICATION_ENDPOINT }}
          EVENT_APPLICATION_START_AT: ${{ vars.EVENT_APPLICATION_START_AT }}
          EVENT_APPLICATION_END_AT: ${{ vars.EVENT_APPLICATION_END_AT }}
        run: pnpm build

      - name: Deploy to Nginx Directory
        shell: bash
        run: |
          release_dir="${DEPLOY_ROOT}/releases/${GITHUB_SHA}"
          mkdir -p "${release_dir}"
          cp -a dist/. "${release_dir}/"

          ln -sfn "${release_dir}" "${DEPLOY_ROOT}/current.next"
          mv -Tf "${DEPLOY_ROOT}/current.next" "${DEPLOY_ROOT}/current"
