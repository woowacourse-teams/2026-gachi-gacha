name: Android Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - android
    paths:
      - 'android/**'
      - '.github/workflows/android-quality.yml'
  push:
    branches:
      - android
    paths:
      - 'android/**'
      - '.github/workflows/android-quality.yml'

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and bundles
        run: npm run check

      - name: Generate development Android native project
        if: github.event_name != 'pull_request'
        env:
          APP_VARIANT: development
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java
        if: github.event_name != 'pull_request'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/android/**/*.gradle*
            android/android/gradle/wrapper/gradle-wrapper.properties

      - name: Build standalone preview APK
        if: github.event_name != 'pull_request'
        working-directory: android/android
        run: ./gradlew assembleRelease

      - name: Upload standalone preview APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: gachi-gacha-android-preview
          path: android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
