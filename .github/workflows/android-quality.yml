name: Android Quality

on:
  workflow_dispatch:
    inputs:
      app_variant:
        description: 'Preview APK environment'
        required: true
        default: development
        type: choice
        options:
          - development
          - production
  pull_request:
    branches:
      - android
    paths:
      - 'android/**'
      - '.github/workflows/android-quality.yml'
  push:
    branches:
      - android
    paths:
      - 'android/**'
      - '.github/workflows/android-quality.yml'

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      EXPO_NO_TELEMETRY: '1'
      KAKAO_MAP_NATIVE_APP_KEY_DEV: ${{ secrets.ANDROID_KAKAO_MAP_NATIVE_APP_KEY_DEV }}
      KAKAO_MAP_NATIVE_APP_KEY_PROD: ${{ secrets.ANDROID_KAKAO_MAP_NATIVE_APP_KEY_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and bundles
        run: npm run check

      - name: Generate Android native project
        if: github.event_name != 'pull_request'
        env:
          APP_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.app_variant || 'development' }}
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java
        if: github.event_name != 'pull_request'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/android/**/*.gradle*
            android/android/gradle/wrapper/gradle-wrapper.properties

      - name: Build standalone preview APK
        if: github.event_name != 'pull_request'
        working-directory: android/android
        run: ./gradlew assembleRelease

      - name: Publish preview Kakao key hash
        if: github.event_name != 'pull_request'
        working-directory: android/android
        shell: bash
        run: |
          KEY_HASH="$(keytool -exportcert -alias androiddebugkey -keystore app/debug.keystore -storepass android -keypass android | openssl sha1 -binary | openssl base64)"
          {
            echo '### Kakao Maps preview registration'
            echo ''
            echo '- Variant: `${{ github.event_name == 'workflow_dispatch' && inputs.app_variant || 'development' }}`'
            echo '- Package: `${{ (github.event_name == 'workflow_dispatch' && inputs.app_variant == 'production') && 'com.gachigacha.app' || 'com.dev.gachigacha.app' }}`'
            echo "- Key hash: \`${KEY_HASH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload standalone preview APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: gachi-gacha-android-preview
          path: android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
