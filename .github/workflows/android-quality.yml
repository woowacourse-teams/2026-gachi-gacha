name: Android Quality

on:
  pull_request:
    branches:
      - android
    paths:
      - 'android/**'
      - '.github/workflows/android-quality.yml'
  push:
    branches:
      - android
    paths:
      - 'android/**'
      - '.github/workflows/android-quality.yml'

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and bundles
        run: npm run check
