name: Android Quality

on:
  workflow_dispatch:
    inputs:
      app_variant:
        description: 'Preview APK environment'
        required: true
        default: development
        type: choice
        options:
          - development
          - production
  pull_request:
    branches:
      - android
    paths:
      - 'android/**'
      - '.github/workflows/android-quality.yml'
  push:
    branches:
      - android
    paths:
      - 'android/**'
      - '.github/workflows/android-quality.yml'

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      EXPO_NO_TELEMETRY: '1'
      KAKAO_MAP_NATIVE_APP_KEY_DEV: ${{ secrets.ANDROID_KAKAO_MAP_NATIVE_APP_KEY_DEV }}
      KAKAO_MAP_NATIVE_APP_KEY_PROD: ${{ secrets.ANDROID_KAKAO_MAP_NATIVE_APP_KEY_PROD }}
      ANDROID_MEMBER_REPORT_ENDPOINT: ${{ secrets.ANDROID_MEMBER_REPORT_ENDPOINT }}
      ANDROID_OAUTH_CALLBACK_BASE_URL_DEV: ${{ vars.ANDROID_OAUTH_CALLBACK_BASE_URL_DEV }}
      ANDROID_OAUTH_CALLBACK_BASE_URL_PROD: ${{ vars.ANDROID_OAUTH_CALLBACK_BASE_URL_PROD }}
      ANDROID_KAKAO_OAUTH_CLIENT_ID_DEV: ${{ vars.ANDROID_KAKAO_OAUTH_CLIENT_ID_DEV }}
      ANDROID_KAKAO_OAUTH_CLIENT_ID_PROD: ${{ vars.ANDROID_KAKAO_OAUTH_CLIENT_ID_PROD }}
      ANDROID_NAVER_OAUTH_CLIENT_ID_DEV: ${{ vars.ANDROID_NAVER_OAUTH_CLIENT_ID_DEV }}
      ANDROID_NAVER_OAUTH_CLIENT_ID_PROD: ${{ vars.ANDROID_NAVER_OAUTH_CLIENT_ID_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and bundles
        run: npm run check

      - name: Generate Android native project
        if: github.event_name != 'pull_request'
        env:
          APP_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.app_variant || 'development' }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Setup Java
        if: github.event_name != 'pull_request'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/android/**/*.gradle*
            android/android/gradle/wrapper/gradle-wrapper.properties

      - name: Compile Kakao Maps native bridge
        if: github.event_name != 'pull_request'
        working-directory: android/android
        run: ./gradlew :gachi-kakao-map:compileReleaseKotlin

      - name: Build standalone preview APK
        if: github.event_name != 'pull_request'
        working-directory: android/android
        run: ./gradlew assembleRelease

      - name: Publish preview registration fingerprints
        if: github.event_name != 'pull_request'
        working-directory: android/android
        shell: bash
        run: |
          KEY_HASH="$(keytool -exportcert -alias androiddebugkey -keystore app/debug.keystore -storepass android -keypass android | openssl sha1 -binary | openssl base64)"
          APP_LINK_SHA256="$(keytool -list -v -alias androiddebugkey -keystore app/debug.keystore -storepass android -keypass android | sed -n 's/.*SHA256: //p')"
          {
            echo '### Android preview registration'
            echo ''
            echo '- Variant: `${{ github.event_name == 'workflow_dispatch' && inputs.app_variant || 'development' }}`'
            echo '- Package: `${{ (github.event_name == 'workflow_dispatch' && inputs.app_variant == 'production') && 'com.gachigacha.app' || 'com.dev.gachigacha.app' }}`'
            echo "- Kakao key hash: \`${KEY_HASH}\`"
            echo "- App Link certificate SHA-256: \`${APP_LINK_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload standalone preview APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: gachi-gacha-android-preview
          path: android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  affiliate-catalog-sync:
    name: Sync Android affiliate catalog
    needs: quality
    if: github.event_name != 'pull_request' && vars.AFFILIATE_CATALOG_SHEET_CSV_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      AFFILIATE_CATALOG_SHEET_CSV_URL: ${{ vars.AFFILIATE_CATALOG_SHEET_CSV_URL }}
      AFFILIATE_CATALOG_CATEGORY_API_URL: https://gachigacha.kro.kr/api/v1/categories
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v7
        with:
          ref: android
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate catalog
        run: npm run catalog:test && npm run catalog:sync && npm run typecheck

      - name: Detect catalog changes
        id: changes
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- android/src/domains/affiliate/generatedCatalog.ts; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            {
              echo '### Android affiliate catalog'
              echo ''
              echo 'The published sheet matches the Android static catalog. No PR was created.'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit synchronized catalog
        if: steps.changes.outputs.changed == 'true'
        id: commit
        working-directory: .
        shell: bash
        run: |
          branch="automation/486-android-affiliate-catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add android/src/domains/affiliate/generatedCatalog.ts
          git commit -m "chore(android): 제휴 상품 카탈로그를 동기화한다"
          git push origin "${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Open Android pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch }}
        working-directory: .
        shell: bash
        run: |
          body_file="${RUNNER_TEMP}/android-affiliate-catalog-pr.md"
          {
            echo '## 작업 내용'
            echo '- Google Sheet의 활성 상품을 검증해 Android 정적 카탈로그로 동기화합니다.'
            echo '- 웹과 같은 카테고리, 노출 기간, placement, revision 계약을 적용합니다.'
            echo ''
            echo '## 관련 이슈'
            echo 'Refs #486'
            echo ''
            echo '## 스크린샷'
            echo '- 정적 데이터 동기화로 UI 구조 변경은 없습니다.'
            echo ''
            echo '## 리뷰 포인트'
            echo '- 자동 생성된 `generatedCatalog.ts` 변경만 포함하는지 확인해 주세요.'
          } > "${body_file}"
          pull_request_url="$(gh pr create \
            --base android \
            --head "${HEAD_BRANCH}" \
            --title "[CHORE] Android 쇼핑 커넥트 카탈로그를 동기화한다" \
            --body-file "${body_file}")"
          {
            echo '### Android affiliate catalog'
            echo ''
            echo "Created PR: ${pull_request_url}"
          } >> "${GITHUB_STEP_SUMMARY}"
